bookdown::gitbook:
  css: [css/cnbook.css, css/style.css]
  pandoc_args:
    - "--lua-filter=lua/cnbook/poetry-word.lua"
    - "--lua-filter=lua/cnbook/table-width.lua"
    - "--lua-filter=lua/cnbook/hline.lua"
    - "--lua-filter=lua/cnbook/index.lua"
    - "--lua-filter=lua/cnbook/sideways-figure.lua"
  config:
    toc:
      collapse: none
      before: |
        <li><a href="./"> @@TITLE@@ </a></li>
      after: |
        <li><a href="https://bookdown.org" target="blank"> @@NAME@@ </a></li>
    download: [pdf, epub, mobi]
    sharing:
      github: no
      facebook: no
  split_by: section
bookdown::pdf_book:
  includes:
    in_header:
      - latex/cnbook/base.tex
      - latex/cnbook/toc-dots.tex
      - latex/cnbook/glyph-fallback.tex
      - latex/cnbook/poetry-word.tex
      - latex/cnbook/sideways-figure.tex
      - latex/preamble.tex
    before_body: latex/before_body.tex
    after_body: latex/after_body.tex
  keep_tex: yes
  dev: "cairo_pdf"
  latex_engine: xelatex
  citation_package: natbib
  template: latex/template.tex
  pandoc_args:
    - "--top-level-division=chapter"
    - "--lua-filter=lua/cnbook/poetry-word.lua"
    - "--lua-filter=lua/cnbook/table-width.lua"
    - "--lua-filter=lua/cnbook/hline.lua"
    - "--lua-filter=lua/cnbook/index.lua"
    - "--lua-filter=lua/cnbook/sideways-figure.lua"
  toc_depth: 4
  toc_unnumbered: no
  toc_appendix: yes
  quote_footer: ["\\begin{flushright}", "\\end{flushright}"]
bookdown::epub_book:
  stylesheet: [css/cnbook.css, css/style.css]
  pandoc_args:
    - "--lua-filter=lua/cnbook/poetry-word.lua"
    - "--lua-filter=lua/cnbook/table-width.lua"
    - "--lua-filter=lua/cnbook/hline.lua"
    - "--lua-filter=lua/cnbook/index.lua"
    - "--lua-filter=lua/cnbook/sideways-figure.lua"
